name: customer_churn

on:
  push:

jobs:
  check-file:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run tests
        run: |
             pip install pytest
             pytest